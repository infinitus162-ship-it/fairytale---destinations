  const destinationKey=id=>destinations[id].country+'|'+destinations[id].name;
  const idForKey=key=>destinations.findIndex((d,i)=>destinationKey(i)===key);
  const historyFor=id=>logs.filter(l=>l.destination===destinationKey(id)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const lastUsed=id=>historyFor(id)[0]?.date||null;
  const ageLabel=date=>date?`Last used: ${daysAgo(date)} ${daysAgo(date)===1?'day':'days'} ago`:'Never used';
  const newId=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
  function storageWarning(message){const el=document.getElementById('storage-warning');el.hidden=false;el.textContent=message;}
  function readLogs(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw===null)return [];const value=JSON.parse(raw);if(!Array.isArray(value)||!value.every(l=>l&&typeof l.id==='string'&&typeof l.destination==='string'&&idForKey(l.destination)!==-1&&validDate(l.date)))throw Error('Invalid history');return value;}catch(e){storageBlocked=true;storageWarning('Your saved history could not be read. To protect it, saving is paused. Check that browser storage is enabled; existing data has not been changed.');return [];}}
  function saveLogs(next){if(storageBlocked){notify('Saving is unavailable. Your existing data has not been changed.');return false;}try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));logs=next;return true;}catch(e){storageWarning('Your browser could not save this change. Storage may be full or disabled. Export your history for safekeeping.');notify('Not saved — please check your browser storage.');return false;}}
  function notify(message){const el=document.getElementById('toast');el.innerHTML=icon('check')+`<span>${esc(message)}</span>`;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3800);}
  const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ß/g,'ss').replace(/æ/g,'ae').replace(/œ/g,'oe').replace(/ø/g,'o').replace(/ð/g,'d').replace(/þ/g,'th').replace(/ł/g,'l').replace(/[^a-z0-9]+/g,' ').trim();
  function distance(a,b){let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let next=[i];for(let j=1;j<=b.length;j++)next[j]=Math.min(next[j-1]+1,row[j]+1,row[j-1]+(a[i-1]===b[j-1]?0:1));row=next;}return row[b.length];}
  function searchDestinations(query){const q=normalize(query);if(!q)return [];const exact=destinations.map((d,i)=>({id:i,name:normalize(d.name)})).filter(d=>d.name.includes(q));if(exact.length)return exact.map(d=>d.id);if(q.length<3)return [];return destinations.map((d,i)=>{const n=normalize(d.name);const candidates=[n,...n.split(' ')];return{id:i,score:Math.min(...candidates.map(c=>distance(q,c)/Math.max(q.length,c.length)))};}).filter(d=>d.score<=.34).sort((a,b)=>a.score-b.score).map(d=>d.id);}
  function bestMatch(name){const q=normalize(name);const exact=destinations.findIndex(d=>normalize(d.name)===q);if(exact!==-1)return{id:exact,kind:'Exact match'};const matches=searchDestinations(name);if(matches.length)return{id:matches[0],kind:matches.length>1?'Suggested match · please check':'Suggested match'};return{id:-1,kind:'No match · choose a destination'};}

n Tracker</h2></div><p>Every place has a story. Keep track of when you told it.<br>Log your destinations and give each one time to shine.</p><div class="entry-tags"><span>Find a destination</span><span>Log your stories</span><span>Revisit thoughtfully</span></div><span class="entry-action">Open the tracker ${icon('arrow')}</span></div></a></section><p class="home-note">${icon('leaf')} Less keeping track. More making magic.</p>`;}
  function renderLibrary(){document.title='Location Library · The Storybook Atlas';app.innerHTML=`${crumbs('Location Library')}<section class="fade-in"><div class="page-top"><div><p class="page-kicker">CHAPTER I · EXPLORE</p><h1 class="page-title">Location Library</h1><p class="page-subtitle">A world of storybook places. Pick a country and wander a little.</p></div><div class="section-icon">${icon('book')}</div></div><div class="library-heading"><h2>Where shall we wander?</h2><span class="quiet-label">${countries.length} countries · ${destinations.length} destinations</span></div><div class="country-grid">${countries.map(country=>`<a class="country-card" href="#/library/${encodeURIComponent(country)}/1"><span class="country-flag" aria-hidden="true">${FLAGS[country]}</span><div class="country-info"><h3>${country}</h3><p>${destinations.filter(d=>d.country===country).length} destinations · 3 tiers</p></div>${icon('chevron')}</a>`).join('')}</div><div class="reference-note">${icon('book')} Just a little inspiration. Usage history lives separately in your Destination Tracker.</div></section>`;}
  function renderCountry(country,tab){const all=destinations.filter(d=>d.country===country);const winter=tab==='winter';const filtered=all.filter(d=>winter?d.winter:d.tier===Number(tab));document.title=country+' · Location Library';app.innerHTML=`${crumbs('Location Library',country)}<section class="fade-in"><div class="page-top"><div><p class="page-kicker">A CHAPTER IN YOUR ATLAS</p><h1 class="page-title">${esc(country)} <span style="font-size:27px;vertical-align:middle;margin-left:7px" aria-hidden="true">${FLAGS[country]}</span></h1><p class="page-subtitle">${all.length} places with a little storybook magic.</p></div><div class="section-icon">${icon('compass')}</div></div><nav class="tabs" aria-label="Destination filters">${['1','2','3','winter'].map(t=>`<a href="#/library/${encodeURIComponent(country)}/${t}" class="tab ${tab===t?'active':''}" ${tab===t?'aria-current="page"':''}>${t==='winter'?'❄️ Winter Wonderland':'Tier '+t}<span class="tab-count">${all.filter(d=>t==='winter'?d.winter:d.tier===Number(t)).length}</span></a>`).join('')}</nav><div class="library-heading"><h2>${winter?'A little winter magic':'Tier '+tab+' destinations'}</h2><span class="quiet-label">${filtered.length} ${filtered.length===1?'place':'places'} to inspire</span></div>${filtered.length?`<div class="destination-list">${filtered.map((d,i)=>`<article class="destination-row"><span class="number">${String(i+1).padStart(2,'0')}</span><h3>${esc(d.name)}</h3>${winter?`<span class="winter-symbols">${d.festive?'<span title="Festive destination" aria-label="Festive destination">🎄</span>':''}${d.conditional?'<span title="Conditional winter destination" aria-label="Conditional winter destination">†</span>':''}</span><span class="tier-tiny">Tier ${d.tier}</span>`:''}</article>`).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">${icon('snow')}</div><h2>No winter places in this chapter</h2><p>There’s still plenty of magic to discover in the tier tabs.</p></div>`}${winter?'<div class="winter-legend"><span>❄️ All entries are winter destinations</span><span>🎄 Festive atmosphere</span><span>† Conditional winter setting</span></div>':''}<div class="reference-note">${icon('leaf')} One place, one record. Winter Wonderland is a seasonal view of the same library.</div></section>`;}
  function renderTracker(){document.title='Destination Tracker · The Storybook Atlas';app.innerHTML=`${crumbs('Destination Tracker')}<section class="fade-in"><div class="page-top tracker-page-top"><div><p class="page-kicker">CHAPTER II · REMEMBER</p><h1 class="page-title">Destination Tracker</h1><p class="page-subtitle">Remember the places you’ve shared. Make every return feel new.</p></div><div class="tracker-tools"><button class="button" id="bulk-open">${icon('upload')} Bulk Import</button></div></div><nav class="tracker-nav" aria-label="Tracker views"><button class="${trackerView==='search'?'active':''}" id="search-tab" ${trackerView==='search'?'aria-current="page"':''}>${icon('search')} Search & log</button><button class="${trackerView==='unused'?'active':''}" id="unused-tab" ${trackerView==='unused'?'aria-current="page"':''}>${icon('clock')} Longest unused</button></nav><div id="tracker-content"></div><div class="tracker-bottom"><span>${icon('lock')} Your history stays here, on this device. No account needed.</span><button class="button text small" id="export-history">${icon('download')} Export history</button></div></section>`;document.getElementById('bulk-open').onclick=openImport;document.getElementById('search-tab').onclick=()=>{location.hash='/tracker';trackerView='search';renderTracker();};document.getElementById('unused-tab').onclick=()=>{location.hash='/tracker/unused';};document.getElementById('export-history').onclick=exportHistory;if(trackerView==='unused')renderUnused();else renderSearch();}
  function renderSearch(){document.getElementById('tracker-content').innerHTML=`<div class="search-box">${icon('search')}<label class="sr-only" for="destination-search">Search all destinations</label><input id="destination-search" class="search-input" type="search" placeholder="Find a destination… try ‘dinkel’ or ‘Colmar’" value="${esc(searchQuery)}" autocomplete="off" spellcheck="false" aria-controls="search-results"><button class="clear-search" id="clear-search" aria-label="Clear search" ${searchQuery?'':'hidden'}>${icon('close')}</button></div><div class="search-help"><span>Search every country and tier. A few letters are all you need.</span><span>${destinations.length} places, endless stories</span></div><div id="search-results" aria-live="polite"></div><div id="destination-detail"></div>`;const input=document.getElementById('destination-search');input.oninput=()=>{searchQuery=input.value;selectedId=null;document.getElementById('clear-search').hidden=!searchQuery;renderResults();renderSelected();};input.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();document.querySelector('.search-result')?.focus();}if(e.key==='Escape'){clearSearch();}};document.getElementById('clear-search').onclick=clearSearch;renderResults();renderSelected();}
  function clearSearch(){searchQuery='';selectedId=null;renderSearch();document.getElementById('destination-search').focus();}
  function renderResults(){const container=document.getElementById('search-results');if(!searchQuery.trim()||selectedId!==null){container.innerHTML='';return;}const ids=searchDestinations(searchQuery);container.innerHTML=`<div class="search-results">${ids.length?ids.map(id=>{const d=destinations[id];return `<button class="search-result" data-id="${id}"><span class="country-flag" style="font-size:20px" aria-hidden="true">${FLAGS[d.country]}</span><span class="result-info"><span class="result-name">${esc(d.name)}</span><span class="result-context">${d.country} · Tier ${d.tier}</span></span>${icon('chevron')}</button>`;}).join(''):`<p class="no-results">No places found for “${esc(searchQuery)}”. Try a shorter name or a different spelling.</p>`}</div>`;container.querySelectorAll('[data-id]').forEach(button=>{button.onclick=()=>selectDestination(Number(button.dataset.id));button.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();button.nextElementSibling?.focus();}if(e.key==='ArrowUp'){e.preventDefault();(button.previousElementSibling||document.getElementById('destination-search')).focus();}};});}
  function selectDestination(id){selectedId=id;searchQuery=destinations[id].name;document.getElementById('destination-search').value=searchQuery;document.getElementById('clear-search').hidden=false;renderResults();renderSelected();document.getElementById('selected-title')?.focus({preventScroll:true});}
  function renderSelected(){const container=document.getElementById('destination-detail');if(!container)return;if(selectedId===null){container.innerHTML=searchQuery.trim()?'':`<div class="empty-state"><div class="empty-icon">${icon('compass')}</div><h2>Every story starts somewhere.</h2><p>Find a destination above to see when you last shared it,<br>or turn a new place into your next chapter.</p></div>`;return;}const d=destinations[selectedId],history=historyFor(selectedId),last=history[0]?.date,alreadyToday=history.some(l=>l.date===today());container.innerHTML=`<article class="selected-card fade-in"><div class="selected-header"><div><h2 id="selected-title" tabindex="-1">${esc(d.name)}</h2><p class="selected-context"><span aria-hidden="true">${FLAGS[d.country]}</span> ${d.country} <span>·</span> Tier ${d.tier}</p></div><span class="section-icon" style="width:39px;height:39px">${icon('pin')}</span></div><div class="selected-state">${icon(last?'clock':'sparkle')}<div><strong>${ageLabel(last)}</strong><small>${last?'Most recent story · '+formatDate(last):'A blank page, ready for a little magic.'}</small></div></div><div class="log-actions"><button class="button primary" id="log-today" ${alreadyToday?'disabled':''}>${icon(alreadyToday?'check':'plus')} ${alreadyToday?'Already logged today':'Log as used today'}</button><button class="button" id="custom-toggle" aria-expanded="false" aria-controls="custom-date-form">${icon('calendar')} Log a custom date</button></div><form class="custom-date" id="custom-date-form" hidden><div><label class="field-label" for="custom-date-input">When did you share this place?</label><input class="field" id="custom-date-input" type="date" required max="${today()}" min="0001-01-01" value="${today()}"></div><button class="button primary" type="submit">Save date ${icon('check')}</button></form><details class="history" ${history.length?'open':''}><summary>${icon('history')} Usage history <span class="history-count">${history.length}</span>${icon('down','chevron')}</summary>${history.length?`<div class="history-list">${history.map(log=>`<div class="history-entry"><span>${formatDate(log.date)} <small>${daysAgo(log.date)} ${daysAgo(log.date)===1?'day':'days'} ago</small></span><button class="history-edit" data-edit="${esc(log.id)}" aria-label="Edit or delete usage on ${esc(formatDate(log.date))}">${icon('edit')} Edit</button></div>`).join('')}</div>`:'<p class="history-empty">No dates logged yet. Your first story belongs here.</p>'}</details></article>`;document.getElementById('log-today').onclick=()=>addLog(today());document.getElementById('custom-toggle').onclick=()=>{const form=document.getElementById('custom-date-form');form.hidden=!form.hidden;document.getElementById('custom-toggle').setAttribute('aria-expanded',String(!form.hidden));if(!form.hidden)document.getElementById('custom-date-input').focus();};document.getElementById('custom-date-form').onsubmit=e=>{e.preventDefault();addLog(document.getElementById('custom-date-input').value);};container.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>openEdit(button.dataset.edit));}
  function addLog(date){if(selectedId===null||!validDate(date)||date>today()){notify('Choose a valid date, today or earlier.');return;}logs=readLogs();if(historyFor(selectedId).some(l=>l.date===date)){notify('This destination is already logged for that date.');return;}if(saveLogs([...logs,{id:newId(),destination:destinationKey(selectedId),date}])){renderSelected();notify(destinations[selectedId].name+' · '+formatDate(date)+' saved.');}}
  function renderUnused(){const entries=destinations.map((d,id)=>({d,id,date:lastUsed(id)})).filter(e=>e.date);entries.sort((a,b)=>sortMode==='name'?a.d.name.localeCompare(b.d.name):sortMode==='newest'?b.date.localeCompare(a.date)||a.d.name.localeCompare(b.d.name):a.date.localeCompare(b.date)||a.d.name.localeCompare(b.d.name));document.getElementById('tracker-content').innerHTML=`<div class="list-toolbar"><div><h2>Ready for another chapter</h2><p class="page-subtitle" style="font-size:11px">Only places you’ve logged. A little space between stories.</p></div><label>Sort by <select class="field" id="unused-sort"><option value="oldest" ${sortMode==='oldest'?'selected':''}>Longest unused</option><option value="newest" ${sortMode==='newest'?'selected':''}>Most recently used</option><option value="name" ${sortMode==='name'?'selected':''}>Destination A–Z</option></select></label></div>${entries.length?`<div class="unused-list">${entries.map((e,i)=>`<button class="unused-row" data-open="${e.id}"><span class="unused-rank">${String(i+1).padStart(2,'0')}</span><span class="unused-info"><strong>${esc(e.d.name)}</strong><small>${e.d.country} · Tier ${e.d.tier}</small></span><span class="unused-days">${daysAgo(e.date)} ${daysAgo(e.date)===1?'day':'days'}<small>Last used ${formatDate(e.date)}</small></span>${icon('chevron')}</button>`).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">${icon('clock')}</div><h2>A little history goes a long way.</h2><p>Once you’ve logged a destination, it will appear here.<br>The places waiting longest will rise to the top.</p><button class="button primary" id="first-log">Find your first destination ${icon('arrow')}</button></div>`}`;document.getElementById('unused-sort').onchange=e=>{sortMode=e.target.value;renderUnused();};document.getElementById('first-log')?.addEventListener('click',()=>{location.hash='/tracker';});document.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>{selectedId=Number(button.dataset.open);searchQuery=destinations[selectedId].name;location.hash='/tracker';});}
  function openEdit(id){editingId=id;const log=logs.find(l=>l.id===id);if(!log)return;const d=destinations[idForKey(log.destination)];const modal=document.getElementById('edit-dialog');modal.innerHTML=`<div class="dialog-header"><div><h2 id="edit-title">Edit a little history</h2><p>${esc(d.name)} · ${d.country}</p></div><button class="close-dialog" data-close aria-label="Close edit dialog">${icon('close')}</button></div><form id="edit-form"><div class="dialog-body"><p class="edit-meta">Change the date of this story, or remove the entry.</p><label class="field-label" for="edit-date">Date used</label><input class="field edit-field" type="date" id="edit-date" value="${log.date}" min="0001-01-01" max="${today()}" required><p class="form-error" id="edit-error" role="alert" hidden></p><div class="delete-confirm" id="delete-confirm" hidden><p>Remove this logged date? This can’t be undone.</p><button type="button" class="button danger small" id="delete-final">Yes, delete this entry</button> <button type="button" class="button text small" id="delete-cancel">Keep it</button></div></div><div class="dialog-footer"><button class="button danger small" type="button" id="delete-entry">${icon('trash')} Delete</button><span class="spacer"></span><button class="button text" type="button" data-close>Cancel</button><button class="button primary" type="submit">Save changes</button></div></form>`;modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>modal.close());document.getElementById('delete-entry').onclick=()=>{document.getElementById('delete-confirm').hidden=false;document.getElementById('delete-final').focus();};document.getElementById('delete-cancel').onclick=()=>document.getElementById('delete-confirm').hidden=true;document.getElementById('delete-final').onclick=()=>{logs=readLogs();if(saveLogs(logs.filter(l=>l.id!==editingId))){modal.close();renderSelected();notify('Entry removed. Your history is up to date.');}};document.getElementById('edit-form').onsubmit=e=>{e.preventDefault();const date=document.getElementById('edit-date').value;const error=document.getElementById('edit-error');if(!validDate(date)||date>today()){error.hidden=false;error.textContent='Choose a valid date, today or earlier.';return;}logs=readLogs();if(logs.some(l=>l.id!==editingId&&l.destination===log.destination&&l.date===date)){error.hidden=false;error.textContent='This destination is already logged for that date.';return;}if(!logs.some(l=>l.id===editingId)){modal.close();renderSelected();notify('This entry was removed in another tab.');return;}if(saveLogs(logs.map(l=>l.id===editingId?{...l,date}:l))){modal.close();renderSelected();notify('Date updated. A little history, corrected.');}};modal.showModal();}
  function importHeader(review){return `<div class="dialog-header"><div><h2 id="import-title">Bring your stories along</h2><p>Bulk import your destination history, one little memory at a time.</p></div><button class="close-dialog" data-close aria-label="Close bulk import">${icon('close')}</button></div><div class="dialog-body"><div class="import-steps"><span class="${review?'':'active'}"><b>${review?'✓':'1'}</b> Paste your history</span>${icon('chevron')}<span class="${review?'active':''}"><b>2</b> Review & save</span></div>`;}
  function openImport(){importSource='';importRows=[];renderImportPaste();document.getElementById('import-dialog').showModal();}
  function bindImportClose(){document.querySelectorAll('#import-dialog [data-close]').forEach(b=>b.onclick=()=>document.getElementById('import-dialog').close());}
  function renderImportPaste(){const modal=document.getElementById('import-dialog');modal.innerHTML=importHeader(false)+`<form id="import-paste-form"><label class="field-label" for="import-text">Destination name, YYYY-MM-DD — one entry per line</label><textarea class="field import-textarea" id="import-text" spellcheck="false" required placeholder="Colmar, 2025-12-12&#10;Dinkelsbühl, 2025-12-18&#10;Woodstock, Vermont, 2025-12-24">${esc(importSource)}</textarea><p class="import-tip">${icon('info')} Names with commas are welcome. We’ll read the date after the final comma and help you check every match before saving.</p><p class="form-error" id="import-error" role="alert" hidden></p></form></div><div class="dialog-footer"><button class="button text" data-close>Cancel</button><button class="button primary" type="submit" form="import-paste-form">Review entries ${icon('arrow')}</button></div>`;bindImportClose();document.getElementById('import-paste-form').onsubmit=e=>{e.preventDefault();importSource=document.getElementById('import-text').value;const lines=importSource.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length){const el=document.getElementById('import-error');el.hidden=false;el.textContent='Paste at least one destination and date to continue.';return;}const seen=new Set(logs.map(l=>l.destination+'|'+l.date));importRows=lines.map(line=>{const comma=line.lastIndexOf(',');const name=comma<0?line:line.slice(0,comma).trim().replace(/^"|"$/g,'');const date=comma<0?'':line.slice(comma+1).trim();const match=bestMatch(name);const key=match.id>=0?destinationKey(match.id)+'|'+date:null;const duplicate=key&&seen.has(key);if(key)seen.add(key);return{name,date:validDate(date)?date:'',rawDate:date,id:match.id,kind:match.kind,include:!duplicate,duplicate:!!duplicate};});renderImportReview();};}
  function renderImportReview(){const modal=document.getElementById('import-dialog');const optionList=(selected)=>`<option value="-1">Choose a destination…</option>`+countries.map(country=>`<optgroup label="${country}">${destinations.map((d,i)=>d.country===country?`<option value="${i}" ${i===selected?'selected':''}>${esc(d.name)} — Tier ${d.tier}</option>`:'').join('')}</optgroup>`).join('');modal.innerHTML=importHeader(true)+`<p class="review-note">A quick look before these become part of your story. Correct any name or date, or uncheck an entry to leave it out.</p><div class="review-rows">${importRows.map((row,i)=>`<div class="review-row"><input type="checkbox" data-include="${i}" ${row.include?'checked':''} aria-label="Include entry ${i+1}"><div><label class="review-original" for="match-${i}">${i+1}. ${esc(row.name)}</label><select class="field ${row.id<0?'invalid':''}" id="match-${i}" data-match="${i}">${optionList(row.id)}</select><span class="match-note">${row.duplicate?'Already present · excluded to avoid a duplicate':esc(row.kind)}</span></div><div><label class="sr-only" for="import-date-${i}">Date for entry ${i+1}</label><input class="field ${!validDate(row.date)||row.date>today()?'invalid':''}" type="date" id="import-date-${i}" data-date="${i}" value="${row.date}" min="0001-01-01" max="${today()}">${!row.date?`<span class="match-note">${row.rawDate?'Invalid date: '+esc(row.rawDate):'Choose a date'}</span>`:row.date>today()?'<span class="match-note">Choose today or earlier</span>':''}</div></div>`).join('')}</div><p class="form-error" id="review-error" role="alert" hidden></p></div><div class="dialog-footer"><span class="review-count" id="review-count"></span><button class="button text" id="import-back">${icon('back')} Back</button><button class="button primary" id="import-save">${icon('check')} Save entries</button></div>`;bindImportClose();updateReviewCount();modal.querySelectorAll('[data-include]').forEach(input=>input.onchange=()=>{importRows[Number(input.dataset.include)].include=input.checked;updateReviewCount();});modal.querySelectorAll('[data-match]').forEach(select=>select.onchange=()=>{importRows[Number(select.dataset.match)].id=Number(select.value);select.classList.toggle('invalid',Number(select.value)<0);select.nextElementSibling.textContent='Match updated by you';updateReviewCount();});modal.querySelectorAll('[data-date]').forEach(input=>input.onchange=()=>{importRows[Number(input.dataset.date)].date=input.value;input.classList.toggle('invalid',!validDate(input.value)||input.value>today());input.nextElementSibling?.remove();updateReviewCount();});document.getElementById('import-back').onclick=renderImportPaste;document.getElementById('import-save').onclick=finalizeImport;}
  function updateReviewCount(){const count=importRows.filter(r=>r.include).length;document.getElementById('review-count').textContent=`${count} of ${importRows.length} ${importRows.length===1?'entry':'entries'} selected`;document.getElementById('import-save').disabled=count===0;}
  function finalizeImport(){const rows=importRows.filter(r=>r.include);const invalid=rows.some(r=>r.id<0||!validDate(r.date)||r.date>today());if(invalid){const error=document.getElementById('review-error');error.hidden=false;error.textContent='Please choose a destination and a valid date (today or earlier) for each selected entry.';error.scrollIntoView({block:'nearest'});return;}if(!rows.length)return;logs=readLogs();const next=[...logs];let added=0,skipped=0;rows.forEach(row=>{const key=destinationKey(row.id);if(next.some(l=>l.destination===key&&l.date===row.date)){skipped++;return;}next.push({id:newId(),destination:key,date:row.date});added++;});if(saveLogs(next)){document.getElementById('import-dialog').close();renderTracker();notify(`${added} ${added===1?'entry':'entries'} saved to your story.${skipped?' '+skipped+' duplicate'+(skipped===1?'':'s')+' skipped.':''}`);}}
  function exportHistory(){if(!logs.length){notify('No history to export yet. Log your first destination to begin.');return;}const text=[...logs].sort((a,b)=>b.date.localeCompare(a.date)).map(log=>`${destinations[idForKey(log.destination)].name}, ${log.date}`).join('\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='storybook-atlas-history-'+today()+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('History exported. Keep it somewhere safe.');}
  function route(){let parts;try{parts=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);}catch(e){parts=[];}document.querySelectorAll('dialog[open]').forEach(d=>d.close());if(parts[0]==='library'){if(parts[1]&&countries.includes(parts[1]))renderCountry(parts[1],['1','2','3','winter'].includes(parts[2])?parts[2]:'1');else renderLibrary();}else if(parts[0]==='tracker'){trackerView=parts[1]==='unused'?'unused':'search';renderTracker();}else renderHome();window.scrollTo(0,0);}
  window.addEventListener('hashchange',route);
  window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY||e.key===null){logs=readLogs();if(location.hash.startsWith('#/tracker')){if(trackerView==='unused')renderUnused();else renderSelected();}}});
  document.querySelectorAll('dialog').forEach(modal=>modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}}));
  // Refresh calendar-day labels after midnight or when returning to the app.
  let displayedDay=today();function refreshDay(){if(displayedDay!==today()){displayedDay=today();if(location.hash.startsWith('#/tracker'))renderTracker();}}
  setInterval(refreshDay,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay();});
  logs=readLogs();route();
  let installPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('install-button').hidden=false;});
  document.getElementById('install-button').onclick=async()=>{if(!installPrompt)return;await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('install-button').hidden=true;};
  window.addEventListener('appinstalled',()=>{document.getElementById('install-button').hidden=true;notify('Your atlas is ready for a little wandering.');});
  if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;document.getElementById('offline-status').innerHTML=icon('cloud')+'<span>Offline ready</span>';}catch(e){document.getElementById('offline-status').innerHTML=icon('info')+'<span>Online only</span>';console.warn('Offline setup unavailable:',e);}});}
  </script>
</body>
